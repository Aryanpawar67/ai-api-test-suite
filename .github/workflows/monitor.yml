name: monitor

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Set these repository secrets. Without MONITOR_BASE_URL the job starts the
      # API locally in mock mode, which only proves the monitor itself works.
      BASE_URL: ${{ secrets.MONITOR_BASE_URL }}
      MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Alert de-duplication state must survive between hourly runs.
      - uses: actions/cache@v4
        with:
          path: monitor/alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Start local mock API (only when no BASE_URL secret)
        if: env.BASE_URL == ''
        run: |
          API_KEYS=ci-monitor-key MOCK_LLM=true nohup uvicorn target_api.main:app --port 8000 > api.log 2>&1 &
          sleep 3
          echo "BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          echo "MONITOR_API_KEY=${MONITOR_API_KEY:-ci-monitor-key}" >> "$GITHUB_ENV"

      - name: Run checks
        run: python monitor/run_checks.py

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures
          path: monitor/failures.jsonl
          if-no-files-found: ignore
